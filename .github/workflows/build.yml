name: Build

on:
    push:
        tags:
            - "*"

jobs:
    build-kindle:
        name: Build Kindle
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
            actions: write
            attestations: write
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
              with:
                  persist-credentials: false

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target
                  key: ${{ runner.os }}-${{ runner.arch }}-cargo-debug-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-${{ runner.arch }}-cargo-debug-

            - name: Install dependencies
              run: |
                  sudo apt update
                  sudo apt install -y just zip

            - name: Install zig
              run: |
                  case ${{ runner.arch }} in
                    X86) ARCH="x86" ;;
                    X64) ARCH="x86_64" ;;
                    ARM) ARCH="arm" ;;
                    ARM64) ARCH="aarch64" ;;
                  esac

                  curl -O "https://ziglang.org/download/0.16.0/zig-${ARCH}-linux-0.16.0.tar.xz"
                  tar xf "zig-${ARCH}-linux-0.16.0.tar.xz"
                  echo "$PWD/zig-${ARCH}-linux-0.16.0" >> $GITHUB_PATH

            - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
              with:
                  target: armv7-unknown-linux-musleabihf

            - name: Install cargo-zigbuild
              run: cargo install --locked cargo-zigbuild

            - name: Build
              run: just build

            - name: Make KUAL extension
              run: |
                  mv target/armv7-unknown-linux-musleabihf/release/kinshare-client extension/bin/kinshare-client
                  mv extension kinshare
                  zip -r kinshare.zip kinshare

            - name: Upload
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
              with:
                  files: kinshare.zip
    build-desktop:
        name: Build Desktop (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write
            packages: write
            actions: write
            attestations: write
            id-token: write
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      output: kinshare-desktop

                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      output: kinshare-desktop

                    - os: macos-latest
                      target: aarch64-apple-darwin
                      output: kinshare-desktop.exe
        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
              with:
                  persist-credentials: false

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target
                  key: ${{ runner.os }}-${{ runner.arch }}-cargo-debug-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-${{ runner.arch }}-cargo-debug-

            - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
              with:
                  target: ${{ matrix.target }}

            - name: Build
              run: cargo build --release --target ${{ matrix.target }}

            - name: Rename
              run: |
                  mv target/${{ matrix.target }}/release/${{ matrix.output }} ${{ matrix.target }}-${{ matrix.output }}

            - name: Upload
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
              with:
                  files: ${{ matrix.target }}-${{ matrix.output }}
