[workspace]
resolver = "3"
members = ["client", "desktop", "server", "shared"]

[workspace.dependencies]
libc = "0.2"
anyhow = "1.0"
rustc-hash = "2.1"
lz4_flex = { version = "0.13", default-features = false }
tokio = { version = "1.52", features = ["signal"] }
iroh = "1.0"
iroh-mdns-address-lookup = "0.4"
